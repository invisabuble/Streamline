services:

  Streamline:
    hostname: Streamline
    container_name: Streamline
    image: streamline:latest
    build:
      context: ./docker
      dockerfile: Streamline/streamline.dockerfile
    privileged: true
    volumes:
      - ./volumes/Streamline:/Streamline
      - /dev:/dev
      - /run/udev:/run/udev:ro
    expose:
      - "8080"
    ports:
      - "8080:8080"
    tty: true
    init: true
    stdin_open: true
    network_mode: host