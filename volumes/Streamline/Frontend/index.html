<html>
    <head>
        <title>Streamline | Dashboard</title>
        <link rel="stylesheet" href="css/Streamline.css">
        <script src="js/Streamline.js"></script>
        <script type="module" src="js/Generic_Directory_Entry.js"></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>

        <header>
            <logo>
                <img src="svg/streamline.svg">
            </logo>
        </header>

        <content>

            <container id="select_devices">
                <container_title class="default_font">Select Device</container_title>
                <select id="device"></select>
            </container>

            <container id="media_list">
                <container_title class="default_font">Library</container_title>
                

                <container id="file-list" class="default_font media_list" onclick="reset_dir()"></container>
                
            </container>

            <container>
                <button onclick="play()">Play</button>
                <button onclick="pause()">Pause</button>
            </container>

        </content>

    </body>

    <script>
        document.addEventListener("DOMContentLoaded", () => Devices());
        document.addEventListener("DOMContentLoaded", () => LoadLibrary());
    </script>
</html>
