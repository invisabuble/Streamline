<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/streamline.css"/>
        <link rel="icon" type="image/svg+xml" href="./image/streamline.svg">
        <title>Streamline</title>
        <script src="js/streamline.js"></script>
    </head>
    <body>

        <header>
            <logo>
                <logo_svg>
                    <img src="./image/streamline.svg">
                </logo_svg>
                <logo_text class="title_text">
                    Streamline
                </logo_text>
            </logo>
            <selector>
                <select id="selector">
                    <option>No AV Devices Found</option>
                </select>
            </selector>
        </header>

        <media_content>
            <content>

                <media_group value="movies">
                    <media_group_title class="title_text">Movies</media_group_title>
                    <media_group_content id="Movie">

                    </media_group_content>
                </media_group>

                <media_group>
                    <media_group_title class="title_text">Series</media_group_title>
                    <media_group_content id="Series">

                    </media_group_content>
                </media_group>

            </content>
            
        </media_content>

    </body>
</html>
